<html lang="pl"><head><title>business.allegro.pl</title>
    <style>
        #no-js-code{
            animation: A 1.5s;
        }
        #embedded{
            overflow:hidden;
            height:100%;
            width:100%;
            position:absolute;
            top:0;
            left:0;
            right:0;
            bottom:0;
        }
    </style>
</head>
<body style="margin:0">
    <p id="no-js-code" style="display: none;">Please enable JS and disable any ad blocker</p>
    <iframe src="https://allegrocaptcha.com/captcha-frontend/business.allegro.pl/b492a852-77ea-4ba9-87b0-56edf3c85301" id="embedded"></iframe>
    <script data-cfasync="false">
        document.getElementById("no-js-code").style.display = "none";
        const getCookieValue = function getCookieValue(a) {
            let b = document.cookie.match("(^|;)\\s*" + a + "\\s*=\\s*([^;]+)");
            return b ? b.pop() : "";
        };
        const reload = function () {
            
            if (document.referrer !== "") {
                let searchParams = new URLSearchParams(window.location.search);
                searchParams.set("dd_referrer", document.referrer);
                window.location.search = searchParams.toString();
            } else {
                location.reload();
            }
        }
        const deviceCtx = getCookieValue("wdctx") || "";
        const iframe = document.getElementById("embedded");
        const captchaURL = new URL("https:\/\/allegrocaptcha.com\/captcha-frontend");
        iframe.onload = () => {
            iframe.contentWindow.postMessage({ type: "context", deviceCtx: deviceCtx }, captchaURL.origin);
        };
        window.addEventListener("message", (event) => {
            if (event.origin !== captchaURL.origin) {
                console.error("[parent] got message from unexpected origin:", event.origin);
                return;
            }
            if (event.data.type === "unlock") {
                if (event.data.value !== "") {
                    document.cookie = "wdctx=" + event.data.value + "; Max-Age=2592000; Domain=.allegro.pl; Path=/; Secure";
                }
                reload();
            } else if (event.data.type === "reload") {
                reload();
            }
        });
    </script>

</body></html>
